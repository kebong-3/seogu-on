name: Collect safety and welfare public data
on:
  push:
    branches: [feature/admin18-real-data-v0.2]
    paths: [.github/workflows/collect-safety-welfare.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download declared public data
        run: |
          mkdir evidence
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,time,datetime,math
          root=pathlib.Path('evidence')
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'SeoOn-PublicData-Prototype/0.2','Referer':'https://www.data.go.kr/'})
            with urllib.request.urlopen(req,timeout=35) as r:return r.read(30000000)
          for name,pk in [('schools','15021148'),('earthquake','15072620'),('heat','15013199'),('welfare','15096296'),('libraries-doc','15013109')]:
            result={'sourceUrl':f'https://www.data.go.kr/data/{pk}/standard.do','retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':[],'pages':0}
            try:
              (root/(name+'.html')).write_bytes(get(result['sourceUrl']))
              if name.endswith('-doc'):continue
              header=json.loads(get(f'https://www.data.go.kr/download/columList.json?pk={pk}&ext=JSON'))
              (root/(name+'-header.json')).write_text(json.dumps(header,ensure_ascii=False),encoding='utf8')
              table=header['tableVO'];total=int(header['totalCount']);result['nationalTotal']=total
              params={'publicDataPk':pk,'colNmList':table['colNmList'],'totalCount':total,'svcTableNm':table['svcTableNm'],'perPage':10000}
              for page in range(1,min(10,math.ceil(total/10000))+1):
                params['page']=page;data=json.loads(get('https://www.data.go.kr/download/standard.json?'+urllib.parse.urlencode(params,doseq=True)))
                if not isinstance(data,list):raise RuntimeError('Unexpected schema')
                result['pages']+=1
                for r in data:
                  txt=' '.join(str(v) for v in r.values() if v is not None)
                  if '서구' in txt and '광주' in txt:result['rows'].append(r)
                time.sleep(.4)
              result['complete']=result['pages']*10000>=total;result['columns']=header['columList'];result['fileName']=header['fileName']
            except Exception as e:result['error']=str(e)[:200];result['complete']=False
            (root/(name+'.json')).write_text(json.dumps(result,ensure_ascii=False),encoding='utf8')
            print(name,len(result['rows']),result.get('error'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: safety-welfare-snapshots
          path: evidence/
          retention-days: 7
