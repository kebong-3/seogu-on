name: Seo-gu v0.4 final public data
on:
  push:
    branches: [feature/city-infrastructure-v0.4]
    paths: [.github/workflows/city-v04-final-public-data.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: |
          mkdir evidence
          python3 -u - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,time,datetime,hashlib,math,concurrent.futures
          root=pathlib.Path('evidence');manifest=[]
          def get(url,data=None,timeout=45):
            req=urllib.request.Request(url,data=data,headers={'User-Agent':'SeoOn-Prototype/0.4','Referer':'https://www.data.go.kr/'})
            with urllib.request.urlopen(req,timeout=timeout) as r:return r.read(60000000)
          def osm(item):
            name,bbox=item;q=f'[out:json][timeout:30];way[building]({bbox});out meta geom;';r={'name':name,'query':q,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            for base in ['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter']:
              try:
                raw=get(base,urllib.parse.urlencode({'data':q}).encode());j=json.loads(raw)
                if 'elements' not in j or j.get('remark'):raise ValueError('incomplete')
                (root/name).write_bytes(raw);r.update(state='received',sourceUrl=base,sha256=hashlib.sha256(raw).hexdigest(),count=len(j['elements']));break
              except Exception as e:r.update(state='failed',error=str(e)[:150])
            manifest.append(r);print(name,r.get('state'),r.get('count'))
          jobs=[]
          xs=[126.798,126.817,126.836,126.855,126.874];ys=[35.151,35.1665,35.182]
          for i in range(4):
            for j in range(2):jobs.append((f'north-{i}-{j}.json',f'{ys[j]},{xs[i]},{ys[j+1]},{xs[i+1]}'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as p:list(p.map(osm,jobs))
          pk='15013108';name='childcare';result={'sourceUrl':f'https://www.data.go.kr/data/{pk}/standard.do','retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':[],'pages':0}
          try:
            raw=get(f'https://www.data.go.kr/download/columList.json?pk={pk}&ext=JSON',timeout=20);header=json.loads(raw);(root/'childcare-header.json').write_bytes(raw)
            table=header['tableVO'];total=int(header['totalCount']);result['nationalTotal']=total;result['columns']=header.get('columList');params={'publicDataPk':pk,'colNmList':table['colNmList'],'totalCount':total,'svcTableNm':table['svcTableNm'],'perPage':10000};seen=set()
            for page in range(1,min(8,math.ceil(total/10000))+1):
              params['page']=page;raw=get('https://www.data.go.kr/download/standard.json?'+urllib.parse.urlencode(params,doseq=True),timeout=30);j=json.loads(raw)
              if not isinstance(j,list):raise ValueError('Not tabular')
              h=hashlib.sha256(raw).hexdigest()
              if h in seen:raise ValueError('Repeated page')
              seen.add(h);result['pages']+=1
              for row in j:
                if '서구' in str(row) and '광주' in str(row):result['rows'].append(row)
              time.sleep(.5)
            result['complete']=result['pages']*10000>=total
          except Exception as e:result['complete']=False;result['error']=str(e)[:180]
          (root/'childcare.json').write_text(json.dumps(result,ensure_ascii=False));(root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: city-v04-final-public-data
          path: evidence/
          retention-days: 7
