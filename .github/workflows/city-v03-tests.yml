name: City 0.5 local and UI validation
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [feature/vworld-disaster-sun-v0.5]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run verify
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 tests/city-regression-ui.py && npm run test:final-ui && npm run test:v05-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-05-offline-validation-NOT-live3D
          path: docs/v05/
          retention-days: 7
