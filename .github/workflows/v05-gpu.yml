name: Seasonal native shadow WebGL test
on:
  push:
    branches: [feature/vworld-disaster-sun-v0.5]
    paths: [.github/workflows/v05-gpu.yml, src/city/sun-engine.js, tests/v05-gpu.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: node scripts/ensure-runtime.mjs
      - run: python tests/v05-gpu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v05-real-webgl-results
          path: docs/v05/gpu-evidence/
          retention-days: 7
