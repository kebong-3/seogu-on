name: Challenge reproducible evidence
on:
  push:
    branches: [main, codex/seoguon-challenge-85-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: challenge-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full syntax, unit, build and release checks
        shell: bash
        run: |
          mkdir -p evidence/challenge
          set -o pipefail
          npm run verify 2>&1 | tee evidence/challenge/verify.log
      - name: Replay actual second-region public data
        run: node scripts/validate-region-replay.mjs --out evidence/challenge/region-replay.json
      - name: Package the exact tracked source and provenance
        run: node scripts/package-challenge.mjs
      - name: Keep successful source package and execution records
        uses: actions/upload-artifact@v4
        with:
          name: seoguon-verified-source-${{ github.sha }}
          path: evidence/challenge/
          if-no-files-found: error
          retention-days: 30
      - name: Keep diagnostics if verification failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seoguon-failed-verification-${{ github.sha }}
          path: evidence/challenge/
          if-no-files-found: ignore
          retention-days: 14
