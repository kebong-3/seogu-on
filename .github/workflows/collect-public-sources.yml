name: Collect public source evidence
on:
  push:
    branches: [feature/admin18-real-data-v0.2]
    paths: [.github/workflows/collect-public-sources.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public documents only
        run: |
          mkdir evidence
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,concurrent.futures,re
          from html.parser import HTMLParser
          out=pathlib.Path('evidence')
          urls={
          'standard-detail.js':'https://www.data.go.kr/js/biz/mvc/std/std-detail-view.js',
          'standard-download.js':'https://www.data.go.kr/js/biz/mvc/std/std-download-manager.js',
          'fire-oas.json':'https://infuser.odcloud.kr/oas/docs?namespace=15138232/v1',
          'seogu-admin.html':'https://www.seogu.gwangju.kr/locationSearchList.es?mid=a10101040000',
          'seogu-shelters.html':'https://www.seogu.gwangju.kr/menu.es?mid=a10306040000',
          'seogu-welfare.html':'https://www.seogu.gwangju.kr/welfare/',
          'seogu-dong.html':'https://www.seogu.gwangju.kr/dong/',
          'seogu-population.html':'https://www.seogu.gwangju.kr/menu.es?mid=a10510050000'
          }
          results=[]
          def fetch(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SeoOn-Research/0.2'})
              with urllib.request.urlopen(req,timeout=30) as r: text=r.read(5000000).decode('utf8','replace'); final=r.url
              (out/name).write_text(text,encoding='utf8');return {'file':name,'sourceUrl':url,'finalUrl':final,'bytes':len(text)}
            except Exception as e:return {'file':name,'sourceUrl':url,'error':type(e).__name__}
          results+=list(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(fetch,urls.items()))
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.items=[];self.href=None;self.text=''
            def handle_starttag(self,t,a):
              if t=='a':self.href=dict(a).get('href');self.text=''
            def handle_data(self,d):
              if self.href:self.text+=d
            def handle_endtag(self,t):
              if t=='a' and self.href:self.items.append((self.text.strip(),self.href));self.href=None
          links=[]
          for name in ['seogu-welfare.html','seogu-dong.html']:
            if (out/name).exists():
              p=Links();p.feed((out/name).read_text());links+=p.items
          chosen=[];seen=set()
          for text,href in links:
            if any(x in text for x in ['시설현황','복지시설','복지관현황','복지관 현황','어린이집 현황','다함께돌봄','지역아동센터','찾아오시는길']):
              url=urllib.parse.urljoin('https://www.seogu.gwangju.kr/',href)
              if urllib.parse.urlparse(url).hostname=='www.seogu.gwangju.kr' and url not in seen:seen.add(url);chosen.append((f'welfare-{len(chosen)}.html',url))
          results+=list(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(fetch,chosen[:12]))
          (out/'selected-links.json').write_text(json.dumps(chosen,ensure_ascii=False),encoding='utf8')
          (out/'sources.json').write_text(json.dumps(results,ensure_ascii=False),encoding='utf8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-public-sources
          path: evidence/
          retention-days: 7
