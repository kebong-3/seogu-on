<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0752a7"><title>서구온 · 연결 확인</title><style>body{font:17px/1.8 system-ui,sans-serif;background:#eef7ff;color:#173e58;max-width:600px;padding:30px 22px;margin:10vh auto}h1{font-size:28px}a{display:inline-block;padding:12px 20px;background:#0752a7;color:#fff;text-decoration:none;border-radius:10px}p{margin:16px 0}</style></head><body><h1>인터넷 연결을 확인해 주세요</h1><p>새 지도와 도보경로를 받으려면 연결이 필요해요. 이미 열려 있는 길안내는 받은 경로의 표시 시간 안에서 기기의 위치 기능으로 이어질 수 있지만 새 경로를 찾을 수 없어요.</p><p>서구온은 현재 위치와 도보경로를 이 기기에 저장하지 않아요. 화면을 다시 열면 위치를 허용하고 경로를 다시 찾아 주세요.</p><a href="/">연결해서 다시 열기</a></body></html>
